name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms
          POSTGRES_DB: tms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tms -d tms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tms:tms@localhost:5432/tms_test
      DIRECT_URL: postgresql://tms:tms@localhost:5432/tms_test
      TEST_DATABASE_URL: postgresql://tms:tms@localhost:5432/tms_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
